    id: mdi_spa_notification
    type: BINARY

sensor:
  - platform: mqtt_subscribe
    id: spa_current_temperature
    name: Spa Current Temperature
    topic: ${gateway_prefix}/sensor/spa_current_temperature/state
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    expire_after: 90s
    on_value:
      then:
        - lambda: |-
            id(last_spa_status_ms) = millis();
        - script.execute: refresh_display
  - platform: mqtt_subscribe
    id: spa_target_temperature
    name: Spa Target Temperature
    topic: ${gateway_prefix}/sensor/spa_target_temperature/state
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    expire_after: 90s
    on_value:
      then:
        - script.execute: refresh_display
  - platform: mqtt_subscribe
    id: spa_jets_speed
    name: Spa Jets Speed
    topic: ${gateway_prefix}/fan/spa_jets/speed_level/state
    accuracy_decimals: 0
    expire_after: 90s
    on_value:
      then:
        - script.execute: refresh_display
  - platform: wifi_signal
    name: Wi-Fi Signal
    update_interval: 60s
  - platform: uptime
    name: Uptime
    update_interval: 60s
  - platform: template
    id: spa_status_age
    name: Spa Status Age
    unit_of_measurement: s
    accuracy_decimals: 0
    update_interval: 5s
    lambda: |-
      if (id(last_spa_status_ms) == 0) return {};
      return (millis() - id(last_spa_status_ms)) / 1000.0f;
  - platform: template
    name: Display Refresh Age
    unit_of_measurement: s
    accuracy_decimals: 0
    update_interval: 5s
    lambda: |-
      if (id(last_display_update_ms) == 0) return {};
      return (millis() - id(last_display_update_ms)) / 1000.0f;

text_sensor:
  - platform: mqtt_subscribe
    id: spa_heating_mode
    name: Spa Heating Mode
    topic: ${gateway_prefix}/select/spa_heating_mode/state
    on_value:
      then:
        - script.execute: refresh_display
  - platform: mqtt_subscribe
    id: spa_jets_state
    name: Spa Jets State
    topic: ${gateway_prefix}/fan/spa_jets/state
    on_value:
      then:
        - script.execute: refresh_display
  - platform: mqtt_subscribe
    id: spa_light_state
    name: Spa Light State
    topic: ${gateway_prefix}/switch/spa_light/state
    on_value:
      then:
        - lambda: |-
            id(spa_light_on) = (x == "ON");
        - script.execute: refresh_display
  - platform: template
    name: Active Spa Alert
    lambda: return id(active_alert);
    update_interval: 5s

binary_sensor:
  - platform: template
    id: spa_link
    name: Spa Link
    device_class: connectivity
    lambda: |-
      return id(gateway_online) && id(last_spa_status_ms) != 0 &&
             (millis() - id(last_spa_status_ms) < 45000UL);
    on_state:
      then:
        - script.execute: refresh_display
  - platform: template
    id: gateway_available
    name: Gateway Available
    device_class: connectivity
    lambda: return id(gateway_online);
  - platform: template
    id: spa_heating
    name: Spa Heating
    device_class: heat
    lambda: return id(spa_heating_on);
  - platform: template
    id: spa_light
    name: Spa Light
    device_class: light
    lambda: return id(spa_light_on);
  - platform: template
    id: spa_priming
    name: Spa Priming
    lambda: return id(spa_priming_on);
  - platform: template
    id: spa_filter1
    name: Spa Filter 1 Running
    lambda: return id(spa_filter1_on);
  - platform: template
    id: spa_filter2
    name: Spa Filter 2 Running
    lambda: return id(spa_filter2_on);
  - platform: template
    id: mqtt_connected
    name: MQTT Connected
    device_class: connectivity
    lambda: return id(mqtt_client).is_connected();

switch:
  - platform: template
    id: display_diagnostics
    name: Display Diagnostics Overlay
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - lambda: id(show_diagnostics) = true;
      - script.execute: refresh_display
    turn_off_action:
      - lambda: id(show_diagnostics) = false;
      - script.execute: refresh_display

globals:
  - id: reset_token
    type: uint32_t
    initial_value: "0"
  - id: last_spa_status_ms
    type: uint32_t
    initial_value: "0"
  - id: last_display_update_ms
    type: uint32_t
    initial_value: "0"
  - id: last_display_signature
    type: uint32_t
    initial_value: "0"
  - id: last_display_link_state
    type: bool
    initial_value: "false"
  - id: spa_notification_code
    type: int
    initial_value: "0"
  - id: spa_heating_mode_raw
    type: int
    initial_value: "0"
  - id: spa_temperature_range_raw
    type: int
    initial_value: "0"
  - id: spa_heating_on
    type: bool
    initial_value: "false"
  - id: spa_light_on
    type: bool
    initial_value: "false"
  - id: spa_priming_on
    type: bool
    initial_value: "false"
  - id: spa_filter1_on
    type: bool
    initial_value: "false"
  - id: spa_filter2_on
    type: bool
    initial_value: "false"
  - id: gateway_online
    type: bool
    initial_value: "false"
  - id: show_diagnostics
    type: bool
    initial_value: "false"
  - id: active_alert
    type: std::string
    initial_value: '""'
  - id: active_alert_code
    type: std::string
    initial_value: '""'
  - id: alert_event_seq
    type: uint32_t
    initial_value: "0"
  - id: alert_until_ms
    type: uint32_t
    initial_value: "0"
  - id: gateway_channel
    type: int
    initial_value: "0"
  - id: gateway_registered
    type: bool
    initial_value: "false"
  - id: gateway_read_only
    type: bool
    initial_value: "true"
  - id: gateway_rx_frames
    type: uint32_t
    initial_value: "0"
  - id: gateway_tx_frames
    type: uint32_t
    initial_value: "0"
  - id: gateway_tx_bytes
    type: uint32_t
    initial_value: "0"
  - id: gateway_critical_overwritten
    type: uint32_t
    initial_value: "0"
  - id: gateway_polls_coalesced
    type: uint32_t
    initial_value: "0"
  - id: gateway_event_pending
    type: uint32_t
    initial_value: "0"

script:
  - id: refresh_display
    then:
      # Coalesce MQTT bursts and cap physical e-paper refreshes at one every
      # 16 seconds. The display lambda reads the latest values when it runs.
      - delay: !lambda |-
          if (id(last_display_update_ms) == 0) return 8000;
          const uint32_t elapsed = millis() - id(last_display_update_ms);
          return elapsed >= 15000 ? 1000 : 16000 - elapsed;
      - if:
          condition:
            lambda: |-
              const bool spa_fresh = id(gateway_online) && id(last_spa_status_ms) != 0 &&
                  (millis() - id(last_spa_status_ms) < 45000UL);
              uint32_t signature = 2166136261UL;
              auto mix = [&signature](uint32_t value) {
                signature = (signature ^ value) * 16777619UL;
              };
              mix(spa_fresh);
              mix(id(mqtt_client).is_connected());
              mix(id(show_diagnostics));
              mix(id(spa_heating_mode_raw));
              mix(id(spa_temperature_range_raw));
              mix(id(spa_heating_on));
              mix(id(spa_light_on));
              mix(id(spa_priming_on));
              mix(id(spa_notification_code));
              mix(id(spa_current_temperature).has_state());
              if (id(spa_current_temperature).has_state())
                mix(static_cast<uint32_t>(id(spa_current_temperature).state * 10.0f + 0.5f));
              mix(id(spa_target_temperature).has_state());
              if (id(spa_target_temperature).has_state())
                mix(static_cast<uint32_t>(id(spa_target_temperature).state * 10.0f + 0.5f));
              mix(id(spa_jets_speed).has_state());
              if (id(spa_jets_speed).has_state())
                mix(static_cast<uint32_t>(id(spa_jets_speed).state));
              for (const char *p = id(active_alert_code).c_str(); *p; ++p)
                mix(static_cast<uint8_t>(*p));
              if (id(show_diagnostics)) {
                mix(id(gateway_channel));
                mix(id(gateway_registered));
                mix(id(gateway_rx_frames));
                mix(id(gateway_tx_frames));
                mix(id(gateway_critical_overwritten));
                mix(id(gateway_polls_coalesced));
                mix(id(gateway_event_pending));
              }
              if (signature == id(last_display_signature)) return false;
              id(last_display_signature) = signature;
              return true;
          then:
            - lambda: id(last_display_update_ms) = millis();
            - component.update: eink_display
    mode: restart
  - id: request_gateway_status
    then:
      - mqtt.publish:
          topic: ${gateway_prefix}/command
          payload: STATUS 5
          qos: 0
          retain: false
  - id: request_gateway_diagnostics
    then:
      - mqtt.publish:
          topic: ${gateway_prefix}/command
          payload: DEBUG 8
          qos: 0
          retain: false
  - id: request_gateway_rs485_status
    then:
      - mqtt.publish:
          topic: ${gateway_prefix}/command
          payload: STATUS 8
          qos: 0
          retain: false
  - id: publish_device_status
    then:
      - mqtt.publish_json:
          topic: ${display_prefix}/status
          qos: 0
          retain: false
          payload: |-
            root["schema_version"] = 1;
            root["message"] = "STATUS";
            root["boot_id"] = id(reset_token);
            root["uptime_ms"] = millis();
            root["mqtt_connected"] = id(mqtt_client).is_connected();
            root["gateway_online"] = id(gateway_online);
            root["spa_link"] = id(gateway_online) && id(last_spa_status_ms) != 0 &&
                (millis() - id(last_spa_status_ms) < 45000UL);
            if (id(last_spa_status_ms) == 0) root["spa_status_age_ms"] = nullptr;
            else root["spa_status_age_ms"] = millis() - id(last_spa_status_ms);
            root["spa_notification_code"] = id(spa_notification_code);
            if (id(spa_current_temperature).has_state())
              root["spa_current_temperature_c"] = id(spa_current_temperature).state;
            else root["spa_current_temperature_c"] = nullptr;
            if (id(spa_target_temperature).has_state())
              root["spa_target_temperature_c"] = id(spa_target_temperature).state;
            else root["spa_target_temperature_c"] = nullptr;
            root["spa_heating_mode_raw"] = id(spa_heating_mode_raw);
            root["spa_temperature_range_raw"] = id(spa_temperature_range_raw);
            root["spa_heating"] = id(spa_heating_on);
            root["spa_priming"] = id(spa_priming_on);
            root["spa_light"] = id(spa_light_on);
            root["spa_filter1_running"] = id(spa_filter1_on);
            root["spa_filter2_running"] = id(spa_filter2_on);
            if (id(spa_jets_speed).has_state()) root["spa_jets_speed"] = id(spa_jets_speed).state;
            else root["spa_jets_speed"] = nullptr;
            if (id(last_display_update_ms) == 0) root["display_refresh_age_ms"] = nullptr;
            else root["display_refresh_age_ms"] = millis() - id(last_display_update_ms);
            root["active_alert"] = id(active_alert);
            root["active_alert_code"] = id(active_alert_code);
            root["alert_event_seq"] = id(alert_event_seq);
            root["gateway_channel"] = id(gateway_channel);
            root["gateway_registered"] = id(gateway_registered);
            root["gateway_read_only"] = id(gateway_read_only);
            root["gateway_rx_frames"] = id(gateway_rx_frames);
            root["gateway_tx_frames"] = id(gateway_tx_frames);
            root["gateway_tx_bytes"] = id(gateway_tx_bytes);
            root["gateway_critical_overwritten"] = id(gateway_critical_overwritten);
            root["gateway_polls_coalesced"] = id(gateway_polls_coalesced);
            root["gateway_event_pending"] = id(gateway_event_pending);
            root["free_heap_bytes"] = ESP.getFreeHeap();
            root["reset_command"] = "RESTART " + std::to_string(id(reset_token));
            root["display_model"] = "${epaper_model}";
  - id: restart_device
    then:
      - delay: 250ms
      - lambda: App.safe_reboot();

interval:
  - interval: 30s
    then:
      - lambda: |-
          if (id(mqtt_client).is_connected() && id(gateway_online))
            id(request_gateway_status).execute();
  - interval: 60s
    then:
      - lambda: |-
          if (id(mqtt_client).is_connected() && id(gateway_online)) {
            id(request_gateway_diagnostics).execute();
            id(request_gateway_rs485_status).execute();
          }
  - interval: 30s
    then:
      - script.execute: publish_device_status
  - interval: 5s
    then:
      - lambda: |-
          const bool spa_link_now = id(gateway_online) && id(last_spa_status_ms) != 0 &&
              (millis() - id(last_spa_status_ms) < 45000UL);
          if (spa_link_now != id(last_display_link_state)) {
            id(last_display_link_state) = spa_link_now;
            id(spa_link).publish_state(spa_link_now);
            id(refresh_display).execute();
          }
          if (id(alert_until_ms) != 0 && int32_t(millis() - id(alert_until_ms)) >= 0) {
            id(alert_until_ms) = 0;
            id(active_alert) = "";
            id(active_alert_code) = "";
            id(refresh_display).execute();
          }

spi:
  clk_pin: GPIO18
  mosi_pin: GPIO23

display:
  - platform: waveshare_epaper
    id: eink_display
    cs_pin: GPIO5
    dc_pin: GPIO17
    reset_pin: GPIO16
    busy_pin: GPIO4
    model: ${epaper_model}
    # Newer e-paper controller revisions can fail to initialize with the
    # default 200 ms reset pulse; ESPHome documents 2 ms as the compatibility fix.
    reset_duration: 2ms
    rotation: 90°
    full_update_every: 30
    update_interval: never
    lambda: |-
      // Read-only restomod display: six unlabeled status icons flank the main
      // temperature. The center is shared by gateway alerts, diagnostics,
      // spa notifications, link state, and normal temperature in that order.
      it.fill(Color::BLACK);
      const int width = it.get_width();
      const int center = width / 2;
      const Color icon_white = Color::BLACK;
      const Color icon_black = Color::WHITE;
      const bool spa_fresh = id(gateway_online) && id(last_spa_status_ms) != 0 &&
          (millis() - id(last_spa_status_ms) < 45000UL);

      // Left: mode, heater, jets. Right: range, light, spa telemetry link.
      // The gateway exposes READY=0, REST=1, READY_IN_REST=3. The TP500
      // heating-mode select represents READY_IN_REST as "ready", but for
      // this status glyph both non-READY modes share the Rest icon.
      if (id(spa_heating_mode_raw) == 1 || id(spa_heating_mode_raw) == 3)
        it.image(6, 6, id(mdi_rest), icon_white, icon_black);
      else
        it.image(6, 6, id(mdi_ready), icon_white, icon_black);
      it.image(6, 49, id(spa_heating_on) ? id(mdi_heat_on) : id(mdi_heat_off),
               icon_white, icon_black);
      it.image(6, 92, id(spa_jets_speed).has_state() && id(spa_jets_speed).state > 0
                         ? id(mdi_jets_on) : id(mdi_jets_off),
               icon_white, icon_black);
      it.image(width - 30, 6, id(spa_temperature_range_raw) == 1
                                ? id(mdi_range_high) : id(mdi_range_low),
               icon_white, icon_black);
      it.image(width - 30, 49, id(spa_light_on) ? id(mdi_light_on) : id(mdi_light_off),
               icon_white, icon_black);
      it.image(width - 30, 92, spa_fresh ? id(mdi_spa_link) : id(mdi_spa_link_off),
               icon_white, icon_black);

      if (id(active_alert_code) == "INVALID_CHANNEL_ASSIGNMENT") {
        it.image(center - 12, 17, id(mdi_channel_limit_alert), icon_white, icon_black);
        it.print(center, 49, id(font_medium), Color::WHITE,
                 TextAlign::TOP_CENTER, "CHANNEL LIMIT");
        it.print(center, 71, id(font_small), Color::WHITE,
                 TextAlign::TOP_CENTER, "PACK MAY NEED RESET");
      } else if (id(active_alert_code) == "POSSIBLE_CHANNEL_LEAK") {
        it.image(center - 12, 17, id(mdi_gateway_alert), icon_white, icon_black);
        it.print(center, 49, id(font_medium), Color::WHITE,
                 TextAlign::TOP_CENTER, "POSSIBLE LEAK");
        it.print(center, 71, id(font_small), Color::WHITE,
                 TextAlign::TOP_CENTER, "OLD CHANNEL MAY REMAIN");
      } else if (id(show_diagnostics)) {
        it.print(center, 3, id(font_medium), Color::WHITE,
                 TextAlign::TOP_CENTER, "DIAGNOSTICS");
        it.printf(center, 25, id(font_small), Color::WHITE, TextAlign::TOP_CENTER,
                  "MQTT %s  GW %s", id(mqtt_client).is_connected() ? "UP" : "DOWN",
                  id(gateway_online) ? "UP" : "DOWN");
        it.printf(center, 41, id(font_small), Color::WHITE, TextAlign::TOP_CENTER,
                  "CH %d  %s", id(gateway_channel), id(gateway_registered) ? "REG" : "WAIT");
        it.printf(center, 57, id(font_small), Color::WHITE, TextAlign::TOP_CENTER,
                  "RX %lu  TX %lu", static_cast<unsigned long>(id(gateway_rx_frames)),
                  static_cast<unsigned long>(id(gateway_tx_frames)));
        it.printf(center, 73, id(font_small), Color::WHITE, TextAlign::TOP_CENTER,
                  "LOST %lu  MERGED %lu",
                  static_cast<unsigned long>(id(gateway_critical_overwritten)),
                  static_cast<unsigned long>(id(gateway_polls_coalesced)));
        it.printf(center, 89, id(font_small), Color::WHITE, TextAlign::TOP_CENTER,
                  "PENDING %lu", static_cast<unsigned long>(id(gateway_event_pending)));
      } else {
        const bool current_is_fresh = spa_fresh && id(spa_current_temperature).has_state();
        if (current_is_fresh) {
          it.printf(center, 39, id(font_temperature), Color::WHITE,
                    TextAlign::CENTER, "%.1f", id(spa_current_temperature).state);
          if (id(spa_target_temperature).has_state())
            it.printf(center, 78, id(font_small), Color::WHITE, TextAlign::TOP_CENTER,
                      "SET %.1f C", id(spa_target_temperature).state);
          else
            it.print(center, 78, id(font_small), Color::WHITE,
                     TextAlign::TOP_CENTER, "SET -- C");

          const char *bottom_message = nullptr;
          char note[32];
          if (id(spa_notification_code) == 0x04) snprintf(note, sizeof(note), "CLN FLTR");
          else if (id(spa_notification_code) == 0x09) snprintf(note, sizeof(note), "CHECK SANITIZER");
          else if (id(spa_notification_code) == 0x0A) snprintf(note, sizeof(note), "CHECK pH");
          else if (id(spa_notification_code) != 0)
            snprintf(note, sizeof(note), "SPA NOTE %02X", id(spa_notification_code));
          if (id(spa_notification_code) != 0) bottom_message = note;
          else if (id(spa_priming_on)) bottom_message = "PRIME PUMPS";
          if (bottom_message != nullptr) {
            int text_x, text_y, text_width, text_height;
            it.get_text_bounds(0, 0, bottom_message, id(font_small), TextAlign::TOP_LEFT,
                               &text_x, &text_y, &text_width, &text_height);
            constexpr int icon_size = 24;
            constexpr int icon_gap = 8;
            const int group_width = icon_size + icon_gap + text_width;
            const int group_left = center - group_width / 2;
            it.image(group_left, 92, id(mdi_spa_notification), icon_white, icon_black);
            it.print(group_left + icon_size + icon_gap, 92 + (icon_size - text_height) / 2,
                     id(font_small), Color::WHITE, TextAlign::TOP_LEFT, bottom_message);
          }
        } else {
          it.print(center, 39, id(font_temperature), Color::WHITE,
                   TextAlign::CENTER, "--.-");
          if (id(spa_target_temperature).has_state())
            it.printf(center, 78, id(font_small), Color::WHITE, TextAlign::TOP_CENTER,
                      "SET %.1f C", id(spa_target_temperature).state);
          else
            it.print(center, 78, id(font_small), Color::WHITE,
                     TextAlign::TOP_CENTER, "SET -- C");
          const char *message = "WAITING FOR SPA";
          if (!id(gateway_online)) message = "GATEWAY OFFLINE";
          else if (id(last_spa_status_ms) != 0) message = "SPA LINK LOST";
          int text_x, text_y, text_width, text_height;
          it.get_text_bounds(0, 0, message, id(font_small), TextAlign::TOP_LEFT,
                             &text_x, &text_y, &text_width, &text_height);
          constexpr int icon_size = 24;
          constexpr int icon_gap = 8;
          const int group_width = icon_size + icon_gap + text_width;
          const int group_left = center - group_width / 2;
          it.image(group_left, 92, id(mdi_spa_notification), icon_white, icon_black);
          it.print(group_left + icon_size + icon_gap, 92 + (icon_size - text_height) / 2,
                   id(font_small), Color::WHITE, TextAlign::TOP_LEFT, message);
        }
      }
